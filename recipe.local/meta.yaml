package:
  name: acoular
  version: "{{ environ.get('VERSION') }}"

source:
  path: ..

build:
  noarch: python
  script: python -m pip install --no-deps -vv .

requirements:
  host:
    - python
    - pip
    - hatchling
    - wheel
  run:
    - python >=3.11,<3.15
    - scikit-learn
    - numba
    - numpy
    - scipy >=1.16.1
    - traits >=6.0
    - pytables

test:
  source_files: # from acoular folder
    - acoular/xml/
    - examples/
  imports:
    - acoular

about:
  home: https://acoular.org
  license: BSD License
  summary: 'Library for acoustic beamforming'
