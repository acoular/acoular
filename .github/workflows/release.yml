name: Release CI ✴️
permissions:
  contents: read
on:
  release:
    types: [ published ]

jobs:
  conda_build:
    uses: acoular/ci/.github/workflows/conda.yml@main

  conda_publish:
    needs: conda_build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: anaconda
    env:
      ANACONDA_TOKEN: ${{ secrets.ANACONDA_TOKEN }}
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8.0.1
        with:
          name: conda-build
          path: conda-pkg/
      - name: Install anaconda-client
        run: conda install --yes -n base anaconda-client
      - name: Upload conda package to Anaconda Cloud
        run: |
          if [ -z "${ANACONDA_TOKEN:-}" ]; then
            echo "::error::ANACONDA_TOKEN is not configured for the anaconda environment."
            exit 1
          fi
          conda run --no-capture-output -n base anaconda --verbose login --at anaconda.org --token "$ANACONDA_TOKEN"
          conda run --no-capture-output -n base anaconda --verbose upload ./conda-pkg/noarch/*.conda

  docs_versioned:
    uses: acoular/ci/.github/workflows/docs.yml@main
    with:
      deploy: true
      package: acoular
      version: ${{ github.ref_name }}
      artifact_name: build-docs-versioned
      artifact_path: ./docs/_build/html
      html_baseurl: "https://acoular.org/acoular/${{ github.ref_name }}/"
      min_version: v26.01
      deploy_switcher: true
    secrets:
      website_gh_pages_token: ${{ secrets.WEBSITE_GH_PAGES_TOKEN }}

  docs_stable:
    needs: docs_versioned
    uses: acoular/ci/.github/workflows/docs.yml@main
    with:
      deploy: true
      package: acoular
      artifact_name: build-docs-stable
      artifact_path: ./docs/_build/html
      html_baseurl: "https://acoular.org/acoular/"
    secrets:
      website_gh_pages_token: ${{ secrets.WEBSITE_GH_PAGES_TOKEN }}

  pypi_build:
    uses: acoular/ci/.github/workflows/pypi.yml@main

  pypi_publish:
    needs: pypi_build
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    environment:
      name: pypi
    steps:
      - name: Check out a copy of the repository
        uses: actions/checkout@v6
      - name: Set up uv
        uses: astral-sh/setup-uv@v7
      - name: Download artifacts
        uses: actions/download-artifact@v7
        with:
          name: package-build
          path: dist/
      - name: Publish distribution
        run: uv publish --index pypi
