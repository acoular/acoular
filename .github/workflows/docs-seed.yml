name: "Manual: Seed release docs (run only for versions greater than 26.05)"
run-name: Seed docs for ${{ inputs.version_tag }}
permissions:
  contents: read
on:
  workflow_dispatch:
    inputs:
      version_tag:
        description: "Git tag to build (e.g. v26.07)"
        required: true
        type: string
      deploy_as_stable:
        description: "Deploy to the stable root (/acoular/) instead of the versioned path"
        required: true
        default: false
        type: boolean

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      target_dir: ${{ steps.target.outputs.dir }}
    steps:
      - name: Choose deployment target
        id: target
        run: |
          tag="${{ inputs.version_tag }}"
          echo "version_match=${tag#v}" >> "$GITHUB_OUTPUT"
          if ${{ inputs.deploy_as_stable }}; then
            echo "baseurl=https://acoular.org/acoular/" >> "$GITHUB_OUTPUT"
            echo "dir=." >> "$GITHUB_OUTPUT"
          else
            echo "baseurl=https://acoular.org/acoular/${{ inputs.version_tag }}/" >> "$GITHUB_OUTPUT"
            echo "dir=${{ inputs.version_tag }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out tag
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.version_tag }}

      - name: Detect build environment
        id: env
        run: |
          if [ -f .python-version ]; then
            PYTHON=$(cat .python-version)
          else
            PYTHON=$(grep 'requires-python' pyproject.toml | grep -oP '\d+\.\d+' | head -1)
            PYTHON=${PYTHON:-3.10}
          fi
          echo "python=${PYTHON}" >> $GITHUB_OUTPUT

          if [ -f uv.lock ]; then
            echo "frozen=--frozen --exact" >> $GITHUB_OUTPUT
          else
            echo "frozen=" >> $GITHUB_OUTPUT
          fi

          if grep -q '\[dependency-groups\]' pyproject.toml; then
            echo "docs-flag=--group docs" >> $GITHUB_OUTPUT
          else
            echo "docs-flag=--extra docs" >> $GITHUB_OUTPUT
          fi

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ steps.env.outputs.python }}

      - name: Set up Pandoc
        uses: acoular/ci/.github/actions/setup-pandoc@main
        with:
          os: ubuntu-latest

      - name: Set up PortAudio
        uses: acoular/ci/.github/actions/setup-portaudio@main
        with:
          os: ubuntu-latest

      - name: Set up Graphviz
        uses: acoular/ci/.github/actions/setup-graphviz@main
        with:
          os: ubuntu-latest

      - name: Build docs
        env:
          DOCS_BASEURL: ${{ steps.target.outputs.baseurl }}
          DOCS_SWITCHER_JSON_URL: "https://acoular.org/acoular/_static/switcher.json"
          DOCS_VERSION_MATCH: ${{ steps.target.outputs.version_match }}
        run: uv run ${{ steps.env.outputs.frozen }} ${{ steps.env.outputs.docs-flag }} make -C docs html

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: build-docs-${{ inputs.version_tag }}
          path: ./docs/_build/html

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Prepare payload
        run: mkdir -p "./payload/acoular/${{ needs.build.outputs.target_dir }}"
      - name: Generate switcher.json
        uses: acoular/ci/.github/actions/generate-switcher@main
        with:
          package-path: acoular
          min-version: v26.01
          output: payload/acoular/_static/switcher.json
      - name: Download build artifact
        uses: actions/download-artifact@v7
        with:
          name: build-docs-${{ inputs.version_tag }}
          path: ./payload/acoular/${{ needs.build.outputs.target_dir }}
      - name: Deploy package documentation to website gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          external_repository: acoular/website
          publish_branch: gh-pages
          personal_token: ${{ secrets.WEBSITE_GH_PAGES_TOKEN }}
          publish_dir: payload/acoular
          destination_dir: acoular
          keep_files: true
          enable_jekyll: false
